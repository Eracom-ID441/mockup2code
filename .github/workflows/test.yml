name: Mes Tests de Fusion HTML

# L'événement "workflow_dispatch" active le bouton "Run workflow" manuellement
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repo
        uses: actions/checkout@v4

      - name: Fusionner proprement (Full Body Content)
        run: |
          # 1. Préparation du squelette index.html
          echo "<!DOCTYPE html>" > index.html
          echo "<html lang='fr'><head>" >> index.html
          echo "<meta charset='UTF-8'>" >> index.html
          echo "<meta name='viewport' content='width=device-width, initial-scale=1.0'>" >> index.html
          echo "<title>ID441 | mokup2code</title>" >> index.html
          
          # 2. GESTION DU CSS
          # Extraction des liens sans doublons
          grep -h "<link" [0-9][0-9]-*.html 2>/dev/null | sed 's/^[[:space:]]*//' | sort -u > all_links.tmp || touch all_links.tmp

          # Priorité au defaults.css s'il est présent
          grep "defaults.css" all_links.tmp >> index.html || true
          grep -v "defaults.css" all_links.tmp >> index.html || true
          
          # Ajout des styles internes
          sed -n '/<style>/,/<\/style>/p' [0-9][0-9]-*.html >> index.html 2>/dev/null || true
          
          echo "</head><body>" >> index.html
          
          # 3. EXTRACTION DU CONTENU DU BODY
          if ls [0-9][0-9]-*.html 1> /dev/null 2>&1; then
            for file in $(ls [0-9][0-9]-*.html | sort); do
              echo "" >> index.html
              sed -n '/<body/,/<\/body>/{ /<body/d; /<\/body>/d; p; }' "$file" >> index.html
            done
          fi

          echo "</body></html>" >> index.html
          rm -f all_links.tmp

      - name: Sauvegarder sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # Le commit ne se fait que s'il y a une modification réelle
          if ! git diff --cached --quiet; then
            git commit -m "Fusion manuelle : Full Body content intégré"
            git push
          else
            echo "Aucun changement détecté sur index.html"
          fi