name: Mes Tests de Fusion HTML

# Déclenchement uniquement manuel
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repo
        uses: actions/checkout@v4

      - name: Fusionner proprement (Full Body Content)
        run: |
          echo "💡 Début de la fusion des fichiers HTML..."

          # 1. Préparer le squelette index.html
          echo "<!DOCTYPE html>" > index.html
          echo "<html lang='fr'><head>" >> index.html
          echo "<meta charset='UTF-8'>" >> index.html
          echo "<meta name='viewport' content='width=device-width, initial-scale=1.0'>" >> index.html
          echo "<title>Maxime Margot | Portfolio</title>" >> index.html

          # 2. Gestion du CSS
          grep -h "<link" [0-9][0-9]-*.html 2>/dev/null | sed 's/^[[:space:]]*//' | sort -u > all_links.tmp || true
          grep "defaults.css" all_links.tmp >> index.html || true
          grep -v "defaults.css" all_links.tmp >> index.html || true

          # Ajouter les <style> internes
          sed -n '/<style>/,/<\/style>/p' [0-9][0-9]-*.html >> index.html || true

          echo "</head><body>" >> index.html

          # 3. Extraire tout le contenu du body
          if ls [0-9][0-9]-*.html 1> /dev/null 2>&1; then
            for file in $(ls [0-9][0-9]-*.html | sort); do
              echo "" >> index.html
              sed -n '/<body/,/<\/body>/{ /<body/d; /<\/body>/d; p; }' "$file" >> index.html
              echo "" >> index.html
            done
          fi

          echo "</body></html>" >> index.html
          rm -f all_links.tmp

          echo "✅ Fusion terminée ! index.html est prêt."
      
      - name: Vérifier les changements
        run: |
          git status
          echo "💡 Si des modifications sont présentes, fais un commit manuel sur ton repo."