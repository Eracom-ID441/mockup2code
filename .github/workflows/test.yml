name: Mes Tests de Fusion HTML

on:
  workflow_dispatch: # <--- L'action ne se lance QUE si tu cliques sur le bouton

permissions:
  contents: write    # Nécessaire pour que l'action puisse créer le fichier index.html

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repo
        uses: actions/checkout@v4

      - name: Combiner les fichiers HTML (Version Améliorée)
        run: |
          # 1. Création de la structure propre
          echo "<!DOCTYPE html>" > index.html
          echo "<html lang='fr'><head><meta charset='UTF-8'><title>Test de Fusion</title></head><body>" >> index.html
          
          # 2. On vérifie si des fichiers existent avant de boucler
          if ls [0-9][0-9]-*.html 1> /dev/null 2>&1; then
            for file in $(ls [0-9][0-9]-*.html | sort); do
              echo "" >> index.html
              # J'ajoute une balise <section> pour que ce soit plus facile à styliser après
              echo "<section id='section-${file:0:2}' style='border-bottom: 1px solid #ccc; padding: 20px;'>" >> index.html
              sed -n '/<body>/,/<\/body>/{ /<body>/d; /<\/body>/d; p }' "$file" >> index.html
              echo "</section>" >> index.html
            done
          else
            echo "<p style='color:red;'>Erreur : Aucun fichier de type 01-nom.html trouvé !</p>" >> index.html
          fi

          echo "</body></html>" >> index.html

      - name: Sauvegarder le résultat sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Test : génération manuelle de index.html" || echo "Pas de changement à valider"
          git push