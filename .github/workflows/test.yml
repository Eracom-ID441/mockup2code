name: Fusion HTML Optimisée

on:
  push:
    branches: [ "main" ] # Se lance automatiquement à chaque push
  workflow_dispatch:      # Garde aussi le bouton manuel au cas où

permissions:
  contents: write         # Autorise explicitement l'écriture du fichier index.html

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repo
        uses: actions/checkout@v4

      - name: Combiner les fichiers HTML avec Style
        run: |
          # 1. Création de la structure avec un CSS de base ou commun
          echo "<!DOCTYPE html>" > index.html
          echo "<html><head><meta charset='UTF-8'><title>Projet Commun</title>" >> index.html
          echo "<link rel='stylesheet' href='style.css'>" >> index.html # On lie un style global
          echo "</head><body>" >> index.html
          
          # 2. Boucle de fusion améliorée
          # On vérifie d'abord s'il y a des fichiers pour éviter une erreur
          if ls [0-9][0-9]-*.html 1> /dev/null 2>&1; then
            for file in $(ls [0-9][0-9]-*.html | sort); do
              echo "" >> index.html
              echo "<section class='page-part' id='section-${file:0:2}'>" >> index.html
              sed -n '/<body>/,/<\/body>/{ /<body>/d; /<\/body>/d; p }' "$file" >> index.html
              echo "</section>" >> index.html
            done
          else
            echo "<h1>Aucun fichier trouvé</h1>" >> index.html
          fi

          echo "</body></html>" >> index.html

      - name: Commiter le fichier généré
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          # On commit seulement s'il y a eu une modification réelle
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-build: index.html mis à jour" && git push)