name: Mes Tests de Fusion HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repo
        uses: actions/checkout@v4

      - name: Fusionner les sections et les styles
        run: |
          # 1. Initialisation du fichier index.html
          echo "<!DOCTYPE html>" > index.html
          echo "<html lang='fr'><head>" >> index.html
          echo "<meta charset='UTF-8'>" >> index.html
          echo "<meta name='viewport' content='width=device-width, initial-scale=1.0'>" >> index.html
          echo "<title>Fusion Maxime Margot</title>" >> index.html
          
          # 2. Extraction des liens CSS de tous les fichiers
          if ls [0-9][0-9]-*.html 1> /dev/null 2>&1; then
            for file in $(ls [0-9][0-9]-*.html | sort); do
              # Récupère uniquement les balises <link> ou <style>
              sed -n '/<head>/,/<\/head>/{ /<link/p; /<style>/,/<\/style>/p; }' "$file" >> index.html
            done
          fi
          
          echo "</head><body>" >> index.html
          
          # 3. Extraction de la balise <section> uniquement
          if ls [0-9][0-9]-*.html 1> /dev/null 2>&1; then
            for file in $(ls [0-9][0-9]-*.html | sort); do
              echo "" >> index.html
              # Extrait tout ce qui se trouve entre <section et </section> (inclus)
              sed -n '/<section/,/<\/section>/p' "$file" >> index.html
            done
          else
            echo "<p style='color:red;'>Erreur : Aucun fichier trouvé !</p>" >> index.html
          fi

          echo "</body></html>" >> index.html

      - name: Sauvegarder le résultat sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fusion propre des sections et CSS" || echo "Pas de changement"
          git push