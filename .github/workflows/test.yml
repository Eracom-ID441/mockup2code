name: Mes Tests de Fusion HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repo
        uses: actions/checkout@v4

      - name: Fusionner proprement (Priorité Defaults.css + Sections)
        run: |
          # 1. Préparation du fichier index.html
          echo "<!DOCTYPE html>" > index.html
          echo "<html lang='fr'><head>" >> index.html
          echo "<meta charset='UTF-8'>" >> index.html
          echo "<meta name='viewport' content='width=device-width, initial-scale=1.0'>" >> index.html
          echo "<title>Maxime Margot | Portfolio</title>" >> index.html
          
          # 2. GESTION DU CSS AVEC PRIORITÉ
          # On crée un fichier temporaire pour collecter tous les liens uniques
          grep -h "<link" [0-9][0-9]-*.html | sed 's/^[[:space:]]*//' | sort -u > all_links.tmp

          # On écrit d'abord la ligne de defaults.css (si elle existe)
          grep "defaults.css" all_links.tmp >> index.html || true
          
          # On écrit ensuite toutes les autres lignes SAUF defaults.css
          grep -v "defaults.css" all_links.tmp >> index.html || true
          
          # On ajoute les balises <style> internes s'il y en a
          sed -n '/<style>/,/<\/style>/p' [0-9][0-9]-*.html >> index.html
          
          echo "</head><body>" >> index.html
          
          # 3. EXTRACTION DES SECTIONS
          if ls [0-9][0-9]-*.html 1> /dev/null 2>&1; then
            for file in $(ls [0-9][0-9]-*.html | sort); do
              echo "" >> index.html
              sed -n '/<section/,/<\/section>/p' "$file" >> index.html
            done
          fi

          echo "</body></html>" >> index.html
          rm all_links.tmp

      - name: Sauvegarder sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fusion : defaults.css en priorité" || echo "Rien à commiter"
          git push