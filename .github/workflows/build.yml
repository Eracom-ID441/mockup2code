name: Combiner les fichiers HTML

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repo
        uses: actions/checkout@v4

      - name: Combiner les fichiers HTML
        run: |
          echo "<!DOCTYPE html>" > index.html
          echo "<html><head><meta charset='UTF-8'></head><body>" >> index.html
          for file in $(ls [0-9][0-9]-*.html | sort); do
            echo "<!-- ===== $file ===== -->" >> index.html
            sed -n '/<body>/,/<\/body>/{ /<body>/d; /<\/body>/d; p }' "$file" >> index.html
          done
          echo "</body></html>" >> index.html

      - name: Commiter le fichier généré
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Build: mise à jour de index.html" || echo "Rien à commiter"
          git push